# ==============================================================================
# GOGIGANET BROADBAND - NGINX HARDENED REVERSE PROXY CONFIGURATION
# File: /etc/nginx/sites-available/gogiga.conf
# ==============================================================================

# Rate Limiting Zones (Anti-Spam & DoS Protection)
limit_req_zone $binary_remote_addr zone=gogiga_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gogiga_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=gogiga_register:10m rate=10r/m;

# 1. HTTP to HTTPS Redirect Block (All Subdomains)
server {
    listen 80;
    listen [::]:80;
    server_name portal.gogiga.net.id sales.gogiga.net.id noc-fo.gogiga.net.id rekan.gogiga.net.id;

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server Block (Hardened)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.gogiga.net.id sales.gogiga.net.id noc-fo.gogiga.net.id rekan.gogiga.net.id;

    # SSL Certificates (Managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/gogiga.net.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gogiga.net.id/privkey.pem;

    # SSL Protocols & Ciphers (Modern Strong Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request Buffer & Upload Limits (Support e-KTP photo & digital signatures)
    client_max_body_size 12M;
    client_body_buffer_size 128k;

    # Kunci & Proteksi File Sensitif (Jangan biarkan .db atau .env terunduh)
    location ~* \.(db|sqlite|sqlite3|env|git|log)$ {
        deny all;
        return 404;
    }

    # Proteksi Khusus Brute-Force pada Endpoint Auth Login
    location /api/v1/auth/login {
        limit_req zone=gogiga_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proteksi Khusus Spam Pendaftaran Publik
    location /api/v1/public/register {
        limit_req zone=gogiga_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default Reverse Proxy ke Go Backend (Internal Port 8081)
    location / {
        limit_req zone=gogiga_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # WebSocket & Keep-Alive Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP Forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
